name: shore check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The entry check runs first on purpose: when something is wrong with an
      # entry, the first red step should be the one that says which line of
      # which file, in words its maker can act on.
      - name: Every entry, and the marks this change leaves
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check.mjs --base "origin/$BASE_REF"

      - name: Every entry, and the marks this push leaves
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/check.mjs
          else
            node scripts/check.mjs --base "$BEFORE"
          fi

      - name: The instruments
        run: npm test
